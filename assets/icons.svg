<svg xmlns="http://www.w3.org/2000/svg">
  <!-- VibePicker UI 아이콘 스프라이트
       24 격자, 선 굵기는 CSS .icon 클래스의 icon-stroke 토큰을 따른다.
       사용: <svg class="icon"><use href="assets/icons.svg#copy"/></svg>
       브랜드 보드·목업의 아이콘은 사용자가 고른 세트(js/icons.js)를 쓰고, 이 스프라이트는 VibePicker UI 전용 -->

  <symbol id="copy" viewBox="0 0 24 24">
    <rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/>
    <path d="M15.5 8.5V6.5A2.5 2.5 0 0 0 13 4H6.5A2.5 2.5 0 0 0 4 6.5V13a2.5 2.5 0 0 0 2.5 2.5h2"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>

  <symbol id="x" viewBox="0 0 24 24">
    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
  </symbol>

  <symbol id="plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <symbol id="chevron-down" viewBox="0 0 24 24">
